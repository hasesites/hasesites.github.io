 ['Огурец или помидор',20,'1 шт','s'],['Яблоко',80,'1 шт','s'],['Банан',105,'1 шт','s'],['Апельсин',70,'1 шт','s'],['Мандарин',35,'1 шт','s'],
 ['Груша',90,'1 шт','s'],['Виноград',70,'горсть','s'],['Орехи',190,'горсть 30 г','s'],['Сухофрукты',100,'горсть','s'],['Печенье',120,'2 шт','s'],

 ['Зарядка',3.5],['Танцы',5],['Велосипед',6],['Плавание',6],['Растяжка, йога',2.5],['Подъём по лестнице',8],
 ['Растяжка после смены',2.5],['Уборка дома',3.3],['Работа в огороде',4],['Аквааэробика',5.3]
];
const ROUTINES=[ // выходной день: мягко к коленям, без прыжков и выпадов
 {n:'Ноги и пресс',x:[['Приседания на стул','встать-сесть, 2 по 10, неглубоко'],['Ягодичный мостик','2 по 15'],['Скручивания на пресс','2 по 12, лёжа'],['Планка на коленях','2 раза по 20 секунд'],['Растяжка','2 минуты']]},
 {n:'Всё тело',x:[['Отведение ноги в сторону','стоя у стены, по 12 на ногу'],['Отжимания от стены','2 по 12'],['«Велосипед» лёжа','2 по 15'],['Боковая планка на коленях','по 15 секунд на сторону'],['Растяжка','2 минуты']]},
 {n:'Мягкий день',x:[['Ходьба на месте','3 минуты'],['Наклоны в стороны','2 по 10'],['Подъём ног лёжа','2 по 10'],['Кошка-корова','10 раз'],['Глубокое дыхание','1 минута']]},
 {n:'Пресс и спина',x:[['Скручивания','2 по 12'],['«Лодочка» на животе','2 по 8'],['Планка на коленях','3 раза по 20 секунд'],['Подъём таза','2 по 15'],['Растяжка спины','2 минуты']]},
];
const MORNING={n:'Утренняя тренировка',min:15,met:4.5,x:[['Марш на месте с руками','2 минуты, бодро'],['Приседания на стул','12 раз'],['Отжимания от стены','12 раз'],['Ягодичный мостик','15 раз'],['«Велосипед» лёжа','20 раз'],['Шаги в сторону с руками вверх','1 минута'],['Планка на коленях','30 секунд']],note:'Это один круг, около 5 минут. Сделай 3 круга — 15 минут. Без прыжков, коленям не тяжело.'};

const TIPS=[
 'Иди до работы или обратно пешком хотя бы часть пути. 20 минут быстрым шагом — около 90 ккал.',
 'Утро до смены — лучшее время для 15-минутной тренировки. Потом весь день бодрее.',
 'Курица и мясо — это белок, их можно. Шашлык из курицы почти вдвое легче бараньего.',
 'Возьми на смену перекус: банан, кефир, варёное яйцо. Так вечером не накинешься на еду.',
 'Поздний ужин — это нормально при длинной смене. Главное: мясо или рыба плюс овощи, без хлеба и картошки.',
 'Кофе лучше без сахара или с половиной ложки. Три кофе 3 в 1 в день — это уже 210 ккал.',
 'После смены полежи 2 минуты с ногами на стене. Отёк и тяжесть уходят.',

 'Перед едой выпей стакан воды. Часто «голод» — это жажда.',
 'Половина тарелки — овощи. Так порция большая, а калорий мало.',
 'Ужин за 3 часа до сна. Не обязательно до шести, главное не на ночь.',
 'Сладкое лучше днём и маленькой порцией, чем запрещать и срываться.',
 'Ешь медленно. Сытость приходит примерно через 20 минут.',
 'Сон 7–8 часов. После недосыпа тянет на сладкое.',
 'Вес скачет от воды и соли. Смотри на тренд за неделю, а не на один день.',
 'Майонез и масло — незаметные калории. Лучше сметана или йогурт.',
 'Прогулка 30 минут в день — это уже около 150 ккал.',
 'Не пропускай завтрак, если потом вечером переедаешь.',
 'Сладкие напитки и соки — лишние калории. Лучше вода, чай, морс без сахара.',
 'Взвешивайся утром, после туалета, до еды. Так цифры честнее.',
 'Хлеб можно, но 1–2 куска в день, лучше чёрный.',
 'Хорошие перекусы: яблоко, кефир, творог, горсть орехов.',
 'Если сорвалась — ничего страшного. Просто следующий приём пищи как обычно.',
 'Тарелка поменьше — порция кажется больше.',
 'Шаги считаются в телефоне: Google Fit или «Здоровье». Впиши число вечером.',

// ================= СОСТОЯНИЕ =================
const KEY='legkost_v1';
let S=load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.profile) return Object.assign({days:{},weights:{},myFoods:[],myEx:[]},s) }catch(e){} return {profile:null,days:{},weights:{},myFoods:[],myEx:[]} }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)) }catch(e){} }
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dkey(new Date());
const parseD=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(a,b-1,c)};
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtD=d=>d.getDate()+' '+MON[d.getMonth()];
const fmtKg=v=>(Math.round(v*10)/10).toString().replace('.',',');
const num=v=>parseFloat(String(v).replace(',','.'));
function day(k=today()){ return S.days[k]||(S.days[k]={food:[],ex:[],water:0,steps:0,rt:{}}) }

// ================= РАСЧЁТЫ =================
function lastWeight(){ const ks=Object.keys(S.weights).sort(); return ks.length?S.weights[ks[ks.length-1]]:S.profile.start }
function minHealthy(h){ return Math.ceil(18.5*(h/100)**2*2)/2 }
// реальный темп: норма не ниже 1200 ккал, поэтому при малом движении темп медленнее выбранного
const BOOST=[[0,'Нет','как есть'],[20,'20 минут','в день'],[40,'40 минут','в день']];
function boostKcal(min,w){ return Math.round(4.5*3.5*w/200*min) } // быстрая ходьба / тренировка
function effRate(w,h,age,act,rate,bmin=0){ const tdee=(10*w+6.25*h-5*age-161)*[1.2,1.375,1.55][act];
  const kcal=Math.max(1200,Math.round((tdee-rate*1100)/10)*10), extra=boostKcal(bmin,w);
  const food=Math.min(rate,(tdee-kcal)*7/7700); return {tdee,kcal,extra,rate:Math.max(0.15,Math.min(0.8,Math.floor((food+extra*7/7700)*20)/20))} }
function calc(){
  const p=S.profile, w=lastWeight();
  const E=effRate(p.start,p.h,p.age,p.act,p.rate,p.boost||0), N=effRate(w,p.h,p.age,p.act,p.rate,p.boost||0), tdee=N.tdee, kcal=N.kcal;
  const left=Math.max(0,w-p.target);
  const weeksTotal=Math.max(1,Math.ceil((p.start-p.target)/E.rate));
  const endDate=new Date(parseD(p.startDate).getTime()+weeksTotal*7*864e5);
  return {w,kcal,tdee:Math.round(tdee),left,weeksTotal,endDate,lost:Math.max(0,p.start-w),rate:E.rate,boost:p.boost||0,extra:N.extra};
}
function planAt(date){ const p=S.profile; const r=effRate(p.start,p.h,p.age,p.act,p.rate,p.boost||0).rate; const wk=(date-parseD(p.startDate))/(7*864e5); return Math.max(p.target,p.start-wk*r) }

  if(mh&&tg&&tg<mh) return `<div class="warn">При росте ${h} см здоровый минимум — <b>${fmtKg(mh)} кг</b>. Ниже — это уже недовес, может выпадать волос и падать сила. <button class="link" id="fixT">Поставить ${fmtKg(mh)} кг</button></div>`;

}

function exportData(){ const b=new Blob([JSON.stringify(S)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='legkost_'+today()+'.json'; a.click() }

function moveCard(d,c){
  const done=d.ex.filter(x=>!x.rt).reduce((a,x)=>a+x.kcal,0);
  if(!c.boost) return `<button class="card row" id="bst" style="width:100%;text-align:left"><div class="sp"><b>Хочешь быстрее?</b><div class="sub">Включи ускорение: 20–40 минут движения в день</div></div><span class="link">›</span></button>`;
  const pr=Math.min(1,done/c.extra);
  return `<button class="card" id="mv" style="width:100%;text-align:left"><div class="row"><div class="sp"><b>Ускорение</b> <span class="sub">· ${c.boost} мин в день</span></div><span class="sub">${done} из ${c.extra} ккал</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${Math.max(3,pr*100)}%;background:${pr>=1?'#5B8A72':'#D9895B'}"></i></div>
    <div class="sub" style="margin-top:8px">${pr>=1?'Сделано! Сегодня ты идёшь быстрее плана.':'Утренняя тренировка или быстрая прогулка — нажми, чтобы добавить'}</div></button>`;
}
function streak(){ let n=0; const dt=new Date(); if(!logged(dkey(dt))) dt.setDate(dt.getDate()-1);
  while(logged(dkey(dt))){ n++; dt.setDate(dt.getDate()-1) } return n }
function logged(k){ const d=S.days[k]; return !!(S.weights[k]!=null||(d&&(d.food.length||d.water||d.ex.length))) }
function endH0(d){ return isShift(d)?(new Date().getDay()===0?19:21):18 }
function nudge(d,c,eat,hr){
  const ate=d.food.some(f=>f.meal==='b'||f.meal==='l'||f.meal==='s');
  if(hr>=13&&hr<endH0(d)&&!ate&&!d.food.length) return `<div class="tip" style="margin:12px 0 0;flex-direction:column;gap:10px"><div><b>Ты сегодня ещё ничего не ела.</b> Перекуси сейчас — тогда вечером не будет зверского голода.</div>
    <div class="chips">${['Банан','Кефир 1%','Яйцо варёное','Йогурт натуральный'].map(n=>`<button class="chip" data-q="${n}">+ ${n}</button>`).join('')}</div></div>`;
  if(hr>=6&&hr<11&&isShift(d)&&!d.food.some(f=>f.meal==='b')) return `<div class="tip" style="margin:12px 0 0"><div class="ic">☕</div><div><b>Позавтракай до смены.</b> Не только кофе: яйца, творог или каша. Впереди 10 часов на ногах.</div></div>`;
  const left=c.kcal-eat, sun=new Date().getDay()===0, endH=isShift(d)?(sun?19:21):18;
  if(hr>=endH&&left>150) return `<div class="tip" style="margin:12px 0 0"><div class="ic">🍽</div><div>На ужин осталось <b>${left} ккал</b>. Хорошо: ${left>450?'мясо или курица 150 г + гарнир 100 г + салат':'кусок мяса или курицы + овощи, без хлеба'}.</div></div>`;
  if(hr>=endH&&left<=150&&left>=0&&eat>0) return `<div class="tip" style="margin:12px 0 0"><div class="ic">🌙</div><div>Норма почти съедена. Если голодно — кефир или огурец, это почти ничего.</div></div>`;
  return '';
}

function sheet(title,html,bind){
  const e=document.createElement('div'); e.className='sheet';
  e.innerHTML=`<div class="pn"><div class="hd"><h3>${title}</h3><button class="x" data-close>×</button></div>${html}</div>`;
  document.body.appendChild(e);
  const close=()=>{e.remove();render()};

}
function stepper(id,val,stepv,dec){ return `<div class="stepper"><button data-m="${id}">−</button><input id="${id}" inputmode="decimal" value="${dec?fmtKg(val):val}"><button data-p="${id}">+</button></div>`}
function bindStepper(e,id,stepv,dec){

  e.querySelector(`[data-p="${id}"]`).onclick=()=>set((num(inp.value)||0)+stepv);
}

      toast(w<prev?`Минус ${fmtKg(prev-w)} кг — отлично`:w>prev?'Вес скачет, это нормально — смотри на неделю':'Вес записан') };
  });

function autoMeal(){ const h=new Date().getHours(); return h<11?'b':h<16?'l':h<21?'d':'s' }

    <div class="card list" id="fl" style="padding:4px 14px"></div>`,(e,close)=>{
    const draw=()=>{ const ql=q.toLowerCase(); const items=all().filter(f=>!ql||f.n.toLowerCase().includes(ql)).slice(0,80);
      e.querySelector('#fl').innerHTML=items.length?items.map((f,i)=>`<div class="it" data-i="${i}"><div class="nm">${esc(f.n)}${f.my?' <span class="pill" style="font-size:12px;padding:2px 8px">моё</span>':''}<small>${esc(f.u)}</small></div><div class="kc">${f.k} ккал</div>${f.my?`<button class="x" data-del="${f.id}" title="Удалить">×</button>`:`<button class="x" data-hide="${esc(f.n)}" title="Убрать из списка">×</button>`}</div>`).join(''):`<div class="empty">Не нашла. Добавь как своё блюдо ↑</div>`;
      e.querySelectorAll('#fl .it').forEach(r=>r.onclick=ev=>{ if(ev.target.dataset.del){ ev.stopPropagation(); S.myFoods=S.myFoods.filter(x=>x.id!==ev.target.dataset.del); save(); toast('Блюдо удалено'); return draw() }
        if(ev.target.dataset.hide){ ev.stopPropagation(); S.hidden=S.hidden||[]; S.hidden.push(ev.target.dataset.hide); save(); toast('Убрано. Вернуть можно во вкладке «Еда»'); return draw() } portionSheet(items[+r.dataset.i],meal,close) });
    };
    e.querySelector('#q').oninput=ev=>{q=ev.target.value;draw()};
    e.querySelectorAll('#ml button').forEach(b=>b.onclick=()=>{meal=b.dataset.m;e.querySelectorAll('#ml button').forEach(x=>x.classList.toggle('on',x===b))});
    e.querySelector('#mine').onclick=()=>myFoodSheet(meal,close);
    draw();
  });
}
function portionSheet(f,meal,closeParent){
  let pm=1;
  sheet(esc(f.n),`<div class="sub">${esc(f.u)} · ${f.k} ккал</div>
    <div class="field"><label>Порция</label><div class="seg" id="pp">${PORT.map(([t,m])=>`<button data-m="${m}" class="${m===1?'on':''}">${t}<br><small style="font-weight:400">${Math.round(f.k*m)} ккал</small></button>`).join('')}</div></div>
    <div class="field"><label>Сколько порций</label>${stepper('pc',1,1)}</div>
    <button class="btn" id="ok">Добавить · <span id="tot">${f.k}</span> ккал</button>`,(e,close)=>{
    bindStepper(e,'pc',1);
    const tot=()=>Math.round(f.k*pm*Math.max(1,num(e.querySelector('#pc').value)||1));
    const upd=()=>e.querySelector('#tot').textContent=tot();
    e.querySelectorAll('#pp button').forEach(b=>b.onclick=()=>{pm=+b.dataset.m;e.querySelectorAll('#pp button').forEach(x=>x.classList.toggle('on',x===b));upd()});
    e.querySelectorAll('.stepper button').forEach(b=>b.addEventListener('click',upd)); e.querySelector('#pc').oninput=upd;
    e.querySelector('#ok').onclick=()=>{ const n=Math.max(1,num(e.querySelector('#pc').value)||1);
      day().food.push({id:uid(),n:f.n,kcal:tot(),meal,p:(pm!==1?PORT.find(x=>x[1]===pm)[0].toLowerCase()+' ':'')+(n>1?'× '+n:'')}); save();
      e.remove(); closeParent(); toast('Добавлено: '+f.n) };
  });
}
function myFoodSheet(meal,closeParent){
  sheet('Своё блюдо',`<div class="sub" style="margin-bottom:6px">Например «Мамин суп» или «Салат с тунцом». Сохранится в списке.</div>
    <div class="field"><label>Название</label><input class="inp" id="mn" placeholder="Название блюда"></div>
    <div class="field"><label>Какая порция</label><input class="inp" id="mu" placeholder="тарелка, 1 шт, 200 г"></div>
    <div class="field"><label>Калорий в порции</label><input class="inp" id="mk" inputmode="numeric" placeholder="250"></div>
    <div class="sub" style="margin:-4px 4px 12px;font-size:14px">Не знаешь калории? Возьми похожее блюдо из списка или посмотри на упаковке (ккал на 100 г × граммы ÷ 100).</div>
    <button class="btn" id="ok">Сохранить и добавить</button>`,(e,close)=>{
    e.querySelector('#ok').onclick=()=>{ const n=e.querySelector('#mn').value.trim(), u=e.querySelector('#mu').value.trim()||'порция', k=Math.round(num(e.querySelector('#mk').value));
      if(!n) return toast('Впиши название'); if(!(k>0&&k<3000)) return toast('Впиши калории');
      S.myFoods.unshift({id:uid(),n,u,k}); day().food.push({id:uid(),n,kcal:k,meal,p:''}); save(); e.remove(); closeParent(); toast('Сохранено: '+n) };
  });
}

// ---------- ЕДА ----------
function renderFood(){
  const d=day(), c=calc(), {eat}=sumDay(d);
  $('#app').innerHTML=`<div class="wrap"><h1>Еда</h1><div class="sub">Сегодня ${eat} из ${c.kcal} ккал</div>
   <div class="bar" style="margin:12px 0 4px"><i style="width:${Math.min(100,eat/c.kcal*100)}%;background:${eat>c.kcal?'#D9895B':'#5B8A72'}"></i></div>
   ${Object.entries(MEALS).map(([k,t])=>{ const it=d.food.filter(f=>f.meal===k); const s=it.reduce((a,f)=>a+f.kcal,0);
    return `<h2 class="row"><span class="sp">${t}</span><span class="sub">${s?s+' ккал':''}</span></h2><div class="card list" style="padding:4px 16px">
     ${it.map(f=>`<div class="it"><div class="nm">${esc(f.n)}${f.p?`<small>${esc(f.p)}</small>`:''}</div><div class="kc">${f.kcal}</div><button class="x" data-del="${f.id}">×</button></div>`).join('')}
     <div class="it"><button class="link" data-add="${k}" style="padding:4px 0">+ Добавить</button></div></div>` }).join('')}
   <h2>Мои блюда</h2><div class="card list" style="padding:4px 16px">${S.myFoods.length?S.myFoods.map(f=>`<div class="it"><div class="nm">${esc(f.n)}<small>${esc(f.u)}</small></div><div class="kc">${f.k}</div><button class="x" data-mydel="${f.id}">×</button></div>`).join(''):'<div class="empty">Тут будут твои блюда</div>'}
    <div class="it"><button class="link" id="addmy" style="padding:4px 0">+ Новое блюдо</button></div></div>
   <div class="sub" style="margin:10px 4px 0;font-size:14px">Лишнее блюдо в списке можно убрать крестиком ×, когда добавляешь еду.</div>
   ${(S.hidden||[]).length?`<h2>Убранные блюда</h2><div class="card list" style="padding:4px 16px">${S.hidden.map(n=>`<div class="it"><div class="nm">${esc(n)}</div><button class="link" data-unhide="${esc(n)}">Вернуть</button></div>`).join('')}</div>`:''}
  </div>`;
  document.querySelectorAll('[data-unhide]').forEach(b=>b.onclick=()=>{ S.hidden=S.hidden.filter(n=>n!==b.dataset.unhide); save(); renderFood(); toast('Блюдо вернулось в список') });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{d.food=d.food.filter(f=>f.id!==b.dataset.del);save();renderFood()});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>foodSheet(b.dataset.add));
  document.querySelectorAll('[data-mydel]').forEach(b=>b.onclick=()=>{S.myFoods=S.myFoods.filter(f=>f.id!==b.dataset.mydel);save();renderFood()});
  $('#addmy').onclick=()=>myFoodSheet(autoMeal(),render);
}

// ---------- ДВИЖЕНИЕ ----------
function rtIdx(k=today()){ return Math.floor(parseD(k)/864e5)%ROUTINES.length }
function isShift(d){ return d.shift!=null?d.shift:(S.shiftDefault!=null?S.shiftDefault:true) }
function routine(d){ return isShift(d)?AFTER_SHIFT:ROUTINES[rtIdx()] }
function rtDone(d){ return Object.values(d.rt||{}).filter(Boolean).length }
function renderMove(){
  const d=day(); d.rt=d.rt||{}; const r=routine(d); const burn=d.ex.reduce((a,x)=>a+x.kcal,0)+stepKcal(d.steps);
  $('#app').innerHTML=`<div class="wrap"><h1>Движение</h1><div class="sub">Сегодня сожжено около ${burn} ккал</div>
   <h2>${isShift(d)?r.n:'Зарядка дня · '+r.n}</h2><div class="card" style="padding:6px 18px">
    ${r.x.map((x,i)=>`<div class="ex"><button class="chk ${d.rt[i]?'on':''}" data-r="${i}"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></button><div class="sp"><b>${x[0]}</b><div class="sub">${x[1]}</div></div></div>`).join('')}
    <div class="sub" style="padding:10px 0 12px">${isShift(d)?'5 минут вечером после работы. Ногам, спине и коленям станет легче.':'Около 10 минут, бережно к коленям. Каждый день — другой набор.'}</div></div>
   <h2>${MORNING.n} · ${MORNING.min} мин</h2><div class="card" style="padding:6px 18px">
    ${MORNING.x.map(x=>`<div class="ex"><div class="dot on" style="width:8px;height:8px"></div><div class="sp"><b>${x[0]}</b><div class="sub">${x[1]}</div></div></div>`).join('')}
    <div class="sub" style="padding:10px 0 4px">${MORNING.note} Лучше утром до смены.</div>
    <div class="row" style="padding:8px 0 12px;gap:8px">${[1,2,3].map(k=>`<button class="btn ghost sm" data-mr="${k}">${k} ${k===1?'круг':'круга'}</button>`).join('')}</div></div>
   <h2>Быстро добавить</h2><div class="chips">${[10,20,30,40].map(m=>`<button class="chip" data-walk="${m}">Прогулка ${m} мин</button>`).join('')}</div>
   <h2>Шаги</h2><button class="card row" id="stp" style="width:100%;text-align:left"><div class="sp"><div class="big" style="font-size:28px">${d.steps?d.steps.toLocaleString('ru'):'0'}</div><div class="sub">из 8 000 · около ${stepKcal(d.steps)} ккал</div></div><span class="link">Вписать</span></button>
   <h2>Занятия сегодня</h2><div class="card list" style="padding:4px 16px">
    ${d.ex.map(x=>`<div class="it"><div class="nm">${esc(x.n)}<small>${x.min} мин</small></div><div class="kc">${x.kcal} ккал</div><button class="x" data-del="${x.id}">×</button></div>`).join('')||'<div class="empty">Пока ничего. Прогулка тоже считается!</div>'}
    <div class="it"><button class="link" id="addx" style="padding:4px 0">+ Добавить занятие</button></div></div>
  </div>`;
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ const i=b.dataset.r; d.rt[i]=!d.rt[i];
    const all=rtDone(d)===r.x.length, has=d.ex.find(x=>x.rt);
    if(all&&!has){ const sh=isShift(d); d.ex.push({id:uid(),n:sh?'Разгрузка после смены':'Зарядка дня',min:sh?5:10,kcal:sh?exKcal(2.5,5):exKcal(3.5,10),rt:1}); toast(sh?'Разгрузка сделана, отдыхай':'Зарядка сделана, молодец') }
    if(!all&&has) d.ex=d.ex.filter(x=>!x.rt);
    save(); renderMove() });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const x=d.ex.find(x=>x.id===b.dataset.del); if(x&&x.rt) d.rt={}; d.ex=d.ex.filter(x=>x.id!==b.dataset.del); save(); renderMove() });
  $('#stp').onclick=stepsSheet;
  $('#addx').onclick=exSheet;
  document.querySelectorAll('[data-mr]').forEach(b=>b.onclick=()=>{ const k=+b.dataset.mr, m=k*5; d.ex.push({id:uid(),n:'Утренняя тренировка',min:m,kcal:exKcal(MORNING.met,m)}); save(); renderMove(); toast(`Тренировка ${m} мин: ${exKcal(MORNING.met,m)} ккал`) });
  document.querySelectorAll('[data-walk]').forEach(b=>b.onclick=()=>{ const m=+b.dataset.walk; d.ex.push({id:uid(),n:'Быстрая прогулка',min:m,kcal:exKcal(4.3,m)}); save(); renderMove(); toast(`Прогулка ${m} мин: ${exKcal(4.3,m)} ккал`) });
}
function exSheet(){
  const list=()=>[...S.myEx.map(x=>({n:x.n,m:x.m,my:1,id:x.id})),...EXS.map(x=>({n:x[0],m:x[1]}))];
  let sel=null;
  const e=sheet('Добавить занятие',`<div class="chips" id="exl"></div>
    <div class="field" style="margin-top:16px"><label>Сколько минут</label>${stepper('em',20,5)}</div>
    <button class="btn" id="ok">Добавить</button>
    <button class="btn ghost" id="myx" style="margin-top:10px">+ Своё упражнение</button>`,(e,close)=>{
    bindStepper(e,'em',5);
    const draw=()=>{ const L=list(); e.querySelector('#exl').innerHTML=L.map((x,i)=>`<button class="chip ${sel&&sel.n===x.n?'on':''}" data-i="${i}">${esc(x.n)}${x.my?` <span data-xdel="${x.id}" style="margin-left:4px;color:var(--mut)">×</span>`:''}</button>`).join('');
      e.querySelectorAll('#exl .chip').forEach(c=>c.onclick=ev=>{ if(ev.target.dataset.xdel){ S.myEx=S.myEx.filter(x=>x.id!==ev.target.dataset.xdel); save(); if(sel&&sel.my) sel=null; return draw() } sel=L[+c.dataset.i]; draw() }) };
    draw();
    e.querySelector('#ok').onclick=()=>{ if(!sel) return toast('Выбери занятие'); const m=Math.max(1,Math.round(num(e.querySelector('#em').value)||0));
      day().ex.push({id:uid(),n:sel.n,min:m,kcal:exKcal(sel.m,m)}); save(); close(); toast(`${sel.n}: ${exKcal(sel.m,m)} ккал`) };
    e.querySelector('#myx').onclick=()=>{
      sheet('Своё упражнение',`<div class="field"><label>Название</label><input class="inp" id="xn" placeholder="Например: обруч"></div>
        <div class="field"><label>Насколько тяжело</label><div class="seg" id="xi"><button data-m="3" class="on">Легко</button><button data-m="5">Средне</button><button data-m="7.5">Тяжело</button></div></div>
        <button class="btn" id="xok">Сохранить</button>`,(e2,close2)=>{
        let m=3; e2.querySelectorAll('#xi button').forEach(b=>b.onclick=()=>{m=+b.dataset.m;e2.querySelectorAll('#xi button').forEach(x=>x.classList.toggle('on',x===b))});
        e2.querySelector('#xok').onclick=()=>{ const n=e2.querySelector('#xn').value.trim(); if(!n) return toast('Впиши название');
          const x={id:uid(),n,m}; S.myEx.unshift(x); save(); sel={n,m,my:1,id:x.id}; e2.remove(); draw(); toast('Сохранено') };
      });
    };
  });
}

// ---------- ПРОГРЕСС И ПЛАН ----------
function renderPlan(){
  const p=S.profile, c=calc(), start=parseD(p.startDate);
  const ks=Object.keys(S.weights).sort();
  // вехи раз в 2 недели
  const ms=[], stw=c.weeksTotal>16?4:2; for(let w=stw;w<=c.weeksTotal+stw-1;w+=stw){ const dt=new Date(start.getTime()+Math.min(w,c.weeksTotal)*7*864e5); ms.push([dt,planAt(dt)]); if(w>=c.weeksTotal) break }
  if(!ms.length||ms[ms.length-1][1]>p.target) ms.push([c.endDate,p.target]);
  $('#app').innerHTML=`<div class="wrap"><h1>Прогресс</h1>
   <div class="card"><div class="sub">Цель</div><div class="big">${fmtKg(p.target)} кг <span style="font-size:17px;font-weight:500;color:var(--mut)">к ${fmtD(c.endDate)}</span></div>
    <div class="sub" style="margin-top:4px">Минус ${fmtKg(c.rate)} кг в неделю · ${c.weeksTotal} нед. · ${c.kcal} ккал в день</div>
    <div id="ch" style="margin-top:14px"></div>
    <div class="row sub" style="font-size:14px;gap:16px;margin-top:4px"><span><b style="color:var(--acc)">●</b> твой вес</span><span><b style="color:#C9C2B4">- -</b> план</span></div></div>
   <h2>План по шагам</h2><div class="card" style="padding:6px 18px">
    <div class="ms"><div class="dot on"></div><div class="sp">Старт · ${fmtD(start)}</div><b>${fmtKg(p.start)} кг</b></div>
    ${ms.map(([dt,w])=>{ const passed=c.w<=w+0.05; return `<div class="ms"><div class="dot ${passed?'on':''}"></div><div class="sp">${fmtD(dt)}${dt.getFullYear()!==start.getFullYear()?' '+dt.getFullYear():''}</div><b>${fmtKg(w)} кг</b></div>` }).join('')}
   </div>
   <h2>Записи веса</h2><div class="card list" style="padding:4px 16px">
    ${ks.slice().reverse().slice(0,30).map((k,i,a)=>{ const prev=S.weights[a[i+1]]; const df=prev!=null?S.weights[k]-prev:0;
      return `<div class="it"><div class="nm">${fmtD(parseD(k))}</div><span class="sub" style="color:${df<0?'var(--acc)':df>0?'var(--warm)':'var(--mut)'}">${df?(df>0?'+':'−')+fmtKg(Math.abs(df)):''}</span><div class="kc" style="min-width:64px;text-align:right">${fmtKg(S.weights[k])}</div>${ks.length>1?`<button class="x" data-wd="${k}">×</button>`:''}</div>` }).join('')}
   </div>
   <button class="btn ghost" id="edit" style="margin-top:6px">Изменить рост, цель или темп</button>
  </div>`;
  drawChart(ks);
  document.querySelectorAll('[data-wd]').forEach(b=>b.onclick=()=>{ delete S.weights[b.dataset.wd]; save(); renderPlan() });
  $('#edit').onclick=()=>renderSetup(true);
}
function drawChart(ks){
  const p=S.profile, c=calc(), W=Math.min(488,innerWidth-68), H=180, P=28;
  const t0=parseD(p.startDate).getTime(), last=ks.length?parseD(ks[ks.length-1]).getTime():t0;
  const t1=Math.max(c.endDate.getTime(), last);
  const vals=ks.map(k=>S.weights[k]); const lo=Math.min(p.target,...vals)-0.5, hi=Math.max(p.start,...vals)+0.5;
  const X=t=>P+(t-t0)/(t1-t0||1)*(W-P-8), Y=v=>8+(hi-v)/(hi-lo)*(H-30);
  const pts=ks.map(k=>[X(parseD(k).getTime()),Y(S.weights[k])]);
  const grid=[]; for(let v=Math.ceil(lo);v<=hi;v++) grid.push(v);
  const step=Math.ceil(grid.length/5);
  $('#ch').innerHTML=`<svg width="${W}" height="${H}" style="display:block">
   ${grid.filter((v,i)=>i%step===0).map(v=>`<line x1="${P}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="#F0EBE1"/><text x="0" y="${Y(v)+4}" font-size="11" fill="#A9A396">${v}</text>`).join('')}
   <line x1="${X(t0)}" y1="${Y(p.start)}" x2="${X(c.endDate.getTime())}" y2="${Y(p.target)}" stroke="#C9C2B4" stroke-width="2" stroke-dasharray="5 5"/>
   <line x1="${X(c.endDate.getTime())}" y1="${Y(p.target)}" x2="${W}" y2="${Y(p.target)}" stroke="#C9C2B4" stroke-width="2" stroke-dasharray="5 5"/>
   ${pts.length>1?`<polyline points="${pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="#5B8A72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:''}
   ${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#5B8A72"/>`).join('')}
   <text x="${P}" y="${H-4}" font-size="11" fill="#A9A396">${fmtD(new Date(t0))}</text>
   <text x="${W}" y="${H-4}" font-size="11" fill="#A9A396" text-anchor="end">${fmtD(new Date(t1))}</text>
  </svg>`;
}

render();
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
