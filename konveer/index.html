<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Конвейер Hunter</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#f3f1ee;--panel:#fff;--fg:#1b1717;--mut:#6d6463;--line:#e3ddd9;--red:#d3261c;--wa:#1faa59;--tg:#2a9df4}
@media (prefers-color-scheme:dark){:root{--bg:#121011;--panel:#1c191a;--fg:#f2eeec;--mut:#a49c9a;--line:#2e2a2b;--red:#ff4a3d;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:14px}
.stats{display:flex;gap:10px}
.st{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.st b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.st span{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px;min-height:130px}
.name{font-size:21px;font-weight:700;line-height:1.2}
.meta{color:var(--mut);font-size:14px}
.msg{color:var(--mut);font-size:14px;white-space:pre-wrap;max-height:30vh;overflow:auto;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.btns{margin-top:auto;display:grid;gap:10px}
button{font:inherit;font-weight:700;border:0;border-radius:16px;padding:18px;cursor:pointer;color:#fff}
.wa{background:var(--wa);font-size:19px}
.tgb{background:var(--tg)}
.skip{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:600;padding:14px}
button:disabled{opacity:.45}
.note{font-size:13px;color:var(--mut);text-align:center}
.ringw{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)} .ring .fg{stroke:var(--wa);stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);transform:rotate(-90deg);transform-origin:50% 50%}
.rt{display:grid;gap:2px}.rt b{font-size:17px}.rt span{font-size:13px;color:var(--mut)}
.combo{font-weight:800;color:var(--red);font-size:15px;min-height:20px;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.err{color:var(--red)}
</style>
</head>
<body>
<div class="stats">
  <div class="st"><b id="today">–</b><span>сегодня</span></div>
  <div class="st"><b id="ready">–</b><span>с номером</span></div>
</div>
<div class="ringw"><svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" id="rg" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg><div class="rt"><b id="rtb">Норма дня: 30</b><span id="rts">Каждое сообщение приближает к сделке</span></div></div>
<div class="combo" id="combo"></div>
<canvas id="fx"></canvas>
<div class="card" id="card"><div class="meta">Загружаю бизнес…</div></div>
<div class="btns">
  <button class="wa" id="wa" disabled>Написать в WhatsApp</button>
  <button class="tgb" id="tg" hidden>Написать в Telegram</button>
  <button class="skip" id="skip" disabled>Пропустить</button>
  <button class="skip" id="undo" hidden>Не отправилось: нет в WhatsApp</button>
  <div class="note" id="note">Нажал «Написать» → в WhatsApp нажми «Отправить» → вернись сюда, следующий уже готов.</div>
</div>
<script>
const API='https://hasehunter.ehb4013.workers.dev/app/';
const W=window.Telegram&&Telegram.WebApp; try{W.ready();W.expand()}catch(e){}
const init=(W&&W.initData)||'';
const $=id=>document.getElementById(id);
let cur=null, nextP=null;
async function call(path,body){ const r=await fetch(API+path,{method:'POST',headers:{'content-type':'text/plain'},body:JSON.stringify({init,...body})}); return r.json() }
function show(j){
  cur=null; $('wa').disabled=true; $('skip').disabled=true; $('tg').hidden=true;
  if(j&&j.today!=null) $('today').textContent=j.today;
  if(j&&j.ready!=null) $('ready').textContent=j.ready;
  if(!j||j.error){ $('card').innerHTML=`<div class="name err">${j&&j.error==='notmember'?'Нет доступа':'Ошибка'}</div><div class="meta">${j&&j.error==='notmember'?'Тебя нет в команде Hunter.':j&&j.error==='auth'?'Открой конвейер кнопкой из бота Hunter.':'Проверь интернет и открой ещё раз.'}</div>`; return }
  if(j.empty){ $('card').innerHTML=`<div class="name">Номера закончились</div><div class="meta">${j.left?`В очереди ${j.left}, но номера для них ещё не собраны. Mac с HASE Мысли собирает их сам — зайди через пару минут.`:'Очередь пуста. Найди новых в боте: /menu.'}</div>`; return }
  cur=j;
  const txt=j.texts.none||j.texts.weak;
  $('card').innerHTML=`<div class="name"></div><div class="meta"></div><div class="msg"></div>`;
  $('card').querySelector('.name').textContent=j.name;
  $('card').querySelector('.meta').textContent=[j.rubric,j.city,j.phone?'+'+j.phone:''].filter(Boolean).join(' · ');
  $('card').querySelector('.msg').textContent=txt;
  $('wa').disabled=!j.phone; $('skip').disabled=false;
  const u=(String(j.tg||'').match(/t\.me\/([A-Za-z0-9_]{4,})/)||[])[1]; if(u&&!/^(joinchat|share|addlist|c)$/i.test(u)){ $('tg').hidden=false; $('tg').dataset.u=u }
}

// ---- 22.10: игра — норма, комбо, конфетти, вибрация ----
const NORM=30; let combo=0, lastSent=0, lastToday=null;
const H=(t)=>{ try{ W.HapticFeedback&&(t==='ok'?W.HapticFeedback.notificationOccurred('success'):W.HapticFeedback.impactOccurred(t||'light')) }catch(e){} };
function ring(today){ const k=Math.min(1,today/NORM); $('rg').style.strokeDashoffset=String(169.6*(1-k));
  $('rtb').textContent=today>=NORM?`Норма закрыта: ${today} 🔥`:`${today} из ${NORM} на сегодня`;
  $('rts').textContent=today>=NORM?'Всё сверху — чистый бонус':today>=NORM*0.66?`Осталось ${NORM-today} — финишная прямая`:today>=NORM/3?`Ещё ${NORM-today}, темп хороший`:'Каждое сообщение приближает к сделке';
  if(lastToday!==null && today>lastToday){ $('today').classList.remove('pop'); void $('today').offsetWidth; $('today').classList.add('pop');
    if([10,20,NORM,50].includes(today)){ confetti(today>=NORM?220:110); H('ok') } }
  lastToday=today }
function bumpCombo(){ const t=Date.now(); combo = (t-lastSent<120000)? combo+1 : 1; lastSent=t;
  $('combo').textContent = combo>=3 ? `Комбо ×${combo} — не останавливайся` : ''; if(combo>=3) H('medium') }
function confetti(n){ const c=$('fx'), g=c.getContext('2d'); c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; g.scale(devicePixelRatio,devicePixelRatio);
  const cols=['#1faa59','#ffd23f','#ff4a3d','#2a9df4','#ffffff']; const P=[...Array(n)].map(()=>({x:innerWidth/2,y:innerHeight*0.35,vx:(Math.random()-0.5)*14,vy:-Math.random()*13-4,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6,vr:(Math.random()-0.5)*0.4}));
  let f=0; (function step(){ g.clearRect(0,0,innerWidth,innerHeight); P.forEach(p=>{p.vy+=0.38;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6);g.restore()}); if(++f<110) requestAnimationFrame(step); else g.clearRect(0,0,innerWidth,innerHeight) })() }
const _show=show; show=function(j){ _show(j); if(j&&j.today!=null) ring(j.today) };
function load(prev,pst){ nextP=call('next',prev?{prev,pst}:{}).catch(()=>null); return nextP }
function go(prev,pst){ $('card').innerHTML='<div class="meta">Беру следующий…</div>'; load(prev,pst).then(show) }
function open(url,tg){ try{ tg&&W.openTelegramLink?W.openTelegramLink(url):W.openLink(url) }catch(e){ location.href=url } }
$('wa').onclick=()=>{ if(!cur) return; const id=cur.id; H('light'); bumpCombo(); open(`https://wa.me/${cur.phone}?text=${encodeURIComponent(cur.texts.none||cur.texts.weak)}`); lastId=id; $('undo').hidden=false; go(id,'sent') };
$('tg').onclick=()=>{ if(!cur) return; const id=cur.id; H('light'); bumpCombo(); open(`https://t.me/${$('tg').dataset.u}?text=${encodeURIComponent(cur.texts.none||cur.texts.weak)}`,true); lastId=id; $('undo').hidden=false; go(id,'sent') };

let lastId=null;
$('undo').onclick=async()=>{ if(!lastId) return; const id=lastId; lastId=null; $('undo').hidden=true; H('medium');
  const j=await call('next',{undo:id,wa:true}).catch(()=>null); if(j&&j.today!=null){ $('today').textContent=j.today; lastToday=j.today; ring(j.today) } };
$('skip').onclick=()=>{ if(!cur) return; go(cur.id,'skip') };
if(!init){ show({error:'auth'}) } else go();
</script>
</body>
</html>
