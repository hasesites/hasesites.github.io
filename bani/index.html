<script>// Мини-движок для демо-сайтов: {{поля}}, sc-for, sc-if, onClick/onInput/onSubmit.
(function () {
  function get(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, scope);
  }
  var ONE = /^\{\{\s*([\w.$]+)\s*\}\}$/, ANY = /\{\{\s*([\w.$]+)\s*\}\}/g;
  function val(str, scope) {
    var m = str.match(ONE);
    if (m) return get(scope, m[1]);
    return str.replace(ANY, function (_, p) { var v = get(scope, p); return v == null ? '' : String(v); });
  }
  function build(node, scope, out) {
    if (node.nodeType === 3) { var t = val(node.data, scope); out.push(document.createTextNode(t == null ? '' : String(t))); return; }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-for') {
      var list = val(node.getAttribute('list'), scope) || [], as = node.getAttribute('as');
      list.forEach(function (item) { var s = Object.create(scope); s[as] = item; kids(node, s, out); });
      return;
    }
    if (tag === 'sc-if') { if (val(node.getAttribute('value'), scope)) kids(node, scope, out); return; }
    var el = node.namespaceURI && node.namespaceURI !== 'http://www.w3.org/1999/xhtml'
      ? document.createElementNS(node.namespaceURI, tag) : document.createElement(tag);
    el._on = {};
    for (var i = 0; i < node.attributes.length; i++) {
      var a = node.attributes[i], n = a.name;
      if (n.indexOf('hint-') === 0) continue;
      if (n.indexOf('on') === 0) { el._on[n.slice(2).toLowerCase()] = val(a.value, scope); continue; }
      var v = val(a.value, scope);
      if (v === false || v == null) continue;
      el.setAttribute(n, v === true ? 'true' : String(v));
    }
    var c = []; kids(node, scope, c); c.forEach(function (x) { el.appendChild(x); });
    out.push(el);
  }
  function kids(node, scope, out) { var ch = (node.content || node).childNodes; for (var i = 0; i < ch.length; i++) build(ch[i], scope, out); }
  function morph(old, nu) {
    if (old.nodeType !== nu.nodeType || old.nodeName !== nu.nodeName) { old.parentNode.replaceChild(nu, old); return; }
    if (old.nodeType === 3) { if (old.data !== nu.data) old.data = nu.data; return; }
    var i, a;
    for (i = old.attributes.length - 1; i >= 0; i--) { a = old.attributes[i].name; if (!nu.hasAttribute(a)) old.removeAttribute(a); }
    for (i = 0; i < nu.attributes.length; i++) { a = nu.attributes[i]; if (old.getAttribute(a.name) !== a.value) old.setAttribute(a.name, a.value); }
    if (old.tagName === 'INPUT' && nu.hasAttribute('value') && old.value !== nu.getAttribute('value')) old.value = nu.getAttribute('value');
    old._on = nu._on;
    morphKids(old, Array.prototype.slice.call(nu.childNodes));
  }
  function morphKids(parent, list) {
    var cur = Array.prototype.slice.call(parent.childNodes);
    for (var i = 0; i < Math.max(cur.length, list.length); i++) {
      if (i >= cur.length) parent.appendChild(list[i]);
      else if (i >= list.length) parent.removeChild(cur[i]);
      else morph(cur[i], list[i]);
    }
  }
  window.DCLogic = function (props) { this.props = props || {}; this.state = {}; };
  window.DCLogic.prototype.setState = function (p) { Object.assign(this.state, p); this._render(); };
  window.mountDC = function (Comp, tplId, rootId) {
    var tpl = document.getElementById(tplId), root = document.getElementById(rootId);
    var c = new Comp({});
    c._render = function () { var out = []; kids(tpl, c.renderVals(), out); morphKids(root, out); };
    ['click', 'input', 'submit'].forEach(function (type) {
      root.addEventListener(type, function (e) {
        for (var n = e.target; n && n !== root; n = n.parentNode) {
          if (n._on && typeof n._on[type] === 'function') { if (type === 'submit') e.preventDefault(); n._on[type](e); return; }
        }
      });
    });
    c._render();
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'barrel', size: 4, wood: 'spruce', stove: true, tub: false, porch: false, open: 0 };
  }
  renderVals() {
    const s = this.state;
    const P = this.props;
    const rates = { barrel: P.barrelRate ?? 78000, frame: P.frameRate ?? 44000, log: P.logRate ?? 62000 };
    const range = { barrel: [2, 6, 0.5], frame: [12, 36, 2], log: [16, 48, 2] }[s.kind];
    const [minS, maxS, stepS] = range;
    const size = Math.min(maxS, Math.max(minS, s.size));
    const fmt = (n) => Math.round(n).toLocaleString('ru-RU').replace(/ /g, ' ');
    const woodK = s.wood === 'cedar' ? 1.18 : 1;
    const base = size * rates[s.kind] * woodK;
    const extrasCost = (s.stove ? 45000 : 0) + (s.tub ? 85000 : 0) + (s.porch ? 120000 : 0);
    const total = base + extrasCost;
    const days = { barrel: '10–14 дней', frame: '25–35 дней', log: '40–55 дней' }[s.kind];

    const mk = (on) => 'min-height:44px;padding:0 16px;border-radius:12px;font:600 15px Onest,sans-serif;cursor:pointer;border:1px solid ' + (on ? '#E2603A' : '#5A4331') + ';background:' + (on ? '#E2603A' : 'transparent') + ';color:' + (on ? '#1A0A04' : '#F5ECDD');
    const defaults = { barrel: 4, frame: 24, log: 32 };
    const kinds = [['barrel', 'Баня-бочка'], ['frame', 'Каркасная'], ['log', 'Сруб']].map(([id, label]) => ({ label, pick: () => this.setState({ kind: id, size: defaults[id] }), style: mk(s.kind === id) }));
    const woods = [['spruce', 'Ель'], ['cedar', 'Кедр']].map(([id, label]) => ({ label, pick: () => this.setState({ wood: id }), style: mk(s.wood === id) }));
    const extras = [['stove', 'Печь-каменка'], ['tub', 'Купель'], ['porch', 'Веранда']].map(([id, label]) => ({ label, on: !!s[id], pick: () => this.setState({ [id]: !s[id] }), style: mk(!!s[id]) }));

    // Рисунок
    const isBarrel = s.kind === 'barrel';
    const t = (size - minS) / (maxS - minS);
    const w = isBarrel ? 170 + t * 270 : 190 + t * 190;
    const x0 = (520 - w) / 2;
    const hoops = [];
    if (isBarrel) { const n = Math.max(3, Math.round(w / 60)); for (let i = 1; i <= n; i++) hoops.push({ x: Math.round((x0 + (w / (n + 1)) * i) * 10) / 10 }); }
    const lines = [];
    if (!isBarrel) {
      if (s.kind === 'log') { for (let y = 126; y < 240; y += 16) lines.push({ x1: x0, y1: y, x2: x0 + w, y2: y }); }
      else { for (let x = x0 + 26; x < x0 + w; x += 26) lines.push({ x1: x, y1: 112, x2: x, y2: 238 }); }
    }
    const chimX = isBarrel ? x0 + 36 : x0 + w * 0.72;
    const chimTop = isBarrel ? 78 : 62;
    const steamX = chimX + 7;
    const steam = (dx, dy) => 'M' + (steamX + dx) + ' ' + (chimTop - dy) + ' q 8 -12 0 -24 q -8 -12 0 -24';
    const woodTag = s.wood === 'cedar' ? 'кедр' : 'ель';

    const tierSrc = [
      ['БОЧКА', 'Баня-бочка', 'Компактная баня на несколько человек, ставится быстро.', 'barrel', 4, 'м длина'],
      ['КАРКАС', 'Каркасная баня', 'Тёплая баня с отдельной парной и комнатой отдыха.', 'frame', 24, 'м²'],
      ['СРУБ', 'Баня из сруба', 'Классическая русская баня для постоянного использования.', 'log', 32, 'м²']
    ];
    const tiers = tierSrc.map(([tag, title, text, id, sz, unit]) => ({ tag, title, text, size: sz + ' ' + unit, img: { barrel: 'img/bani1.webp', frame: 'img/bani2.webp', log: 'img/bani3.webp' }[id], price: fmt(sz * rates[id] + 45000) }));

    const faqSrc = [
      ['Как считается цена?', 'Цена зависит от типа бани, размера, дерева и дополнений. Калькулятор показывает ориентир, а итоговую сумму мы записываем в договор после осмотра участка.'],
      ['Нужен ли фундамент?', 'Да, для большинства бань нужен фундамент. Вариант подбираем под грунт и размер, и вписываем в смету отдельной строкой.'],
      ['Можно ли изменить проект?', 'Да. Размер, планировку и состав дополнительных работ согласуем до подписания договора.'],
      ['Что получу после сдачи?', 'Готовую баню, акт выполненных работ и рекомендации по уходу за деревом и печью.']
    ];
    const faq = faqSrc.map(([question, answer], i) => ({ question, answer, open: s.open === i, mark: s.open === i ? '−' : '+', toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));

    return {
      guarantee: P.guarantee ?? '5 лет',
      kinds, woods, extras, tiers, faq,
      kindImg: { barrel: 'img/bani1.webp', frame: 'img/bani2.webp', log: 'img/bani3.webp' }[s.kind],
      kindName: { barrel: 'Баня-бочка', frame: 'Каркасная баня', log: 'Баня из сруба' }[s.kind],
      isBarrel, isHouse: !isBarrel,
      x0, w, hoops, lines, chimX, doorX: x0 + w - 26, doorHX: x0 + w * 0.12, winX: x0 + w * 0.46,
      roofPts: (x0 - 14) + ',112 ' + (x0 + w / 2) + ',62 ' + (x0 + w + 14) + ',112',
      steam1: steam(0, 4), steam2: steam(14, 8), steam3: steam(-14, 12),
      minS, maxS, stepS, size,
      sizeLabel: isBarrel ? 'Длина' : 'Площадь',
      sizeText: isBarrel ? (size + ' м, ' + woodTag) : (size + ' м², ' + woodTag),
      onSize: (e) => this.setState({ size: Number(e.target.value) }),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      priceText: fmt(total), baseText: fmt(base), extrasText: fmt(extrasCost), daysText: days,
      stages: [
        { n: '01', title: 'Звонок и расчёт', text: 'Уточняем пожелания и называем ориентир по цене.' },
        { n: '02', title: 'Осмотр участка', text: 'Смотрим грунт и подъезд, согласуем место для бани.' },
        { n: '03', title: 'Договор и смета', text: 'Фиксируем цену, состав работ и график платежей.' },
        { n: '04', title: 'Строительство', text: 'Собираем баню и ставим печь, показываем ход работ.' },
        { n: '05', title: 'Сдача', text: 'Подписываем акт и объясняем уход за баней.' }
      ],
      tiles: [{ title: 'Баня-бочка из кедра', src: 'img/bani1.webp' }, { title: 'Каркасная баня с верандой', src: 'img/bani2.webp' }, { title: 'Баня из сруба', src: 'img/bani3.webp' }, { title: 'Парная с каменкой', src: 'img/bani4.webp' }, { title: 'Купель на террасе', src: 'img/bani5.webp' }, { title: 'Комната отдыха', src: 'img/bani6.webp' }]
    };
  }
}

mountDC(Component,'tpl','app');
</script>
</body>
</html>
