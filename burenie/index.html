      root.addEventListener(type, function (e) {
        for (var n = e.target; n && n !== root; n = n.parentNode) {
          if (n._on && typeof n._on[type] === 'function') { if (type === 'submit') e.preventDefault(); n._on[type](e); return; }
        }
      });
    });
    c._render();
  };
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'sand', depth: 28, equip: 'adapter', zone: 'city', open: 0 };
  }
  renderVals() {
    const s = this.state;
    const sandRate = this.props.sandRate ?? 1700;
    const limeRate = this.props.limeRate ?? 2400;
    const rate = s.kind === 'sand' ? sandRate : limeRate;
    const minD = s.kind === 'sand' ? 8 : 40;
    const maxD = s.kind === 'sand' ? 45 : 140;
    const depth = Math.min(maxD, Math.max(minD, s.depth));
    const equipCost = { none: 0, adapter: 14000, caisson: 38000 }[s.equip];
    const zoneCost = { city: 0, near: 3000, far: 8000 }[s.zone];
    const drill = depth * rate;
    const total = drill + equipCost + zoneCost;
    const fmt = (n) => n.toLocaleString('ru-RU').replace(/ /g, ' ');
    const k = 440 / 140;
    const wellH = Math.round(depth * k * 10) / 10;
    const tipY = 20 + wellH;
    const labelBoxY = Math.min(440, tipY - 22);
    const mk = (on) => 'min-height:44px;padding:0 16px;border-radius:12px;font:600 15px Onest,sans-serif;cursor:pointer;border:1px solid ' + (on ? '#4CC3D9' : '#2E5360') + ';background:' + (on ? '#4CC3D9' : 'transparent') + ';color:' + (on ? '#04181D' : '#E8F1F2');
    const kinds = [
      { label: 'На песок', pick: () => this.setState({ kind: 'sand', depth: 28 }), style: mk(s.kind === 'sand') + ';flex:1' },
      { label: 'Артезианская', pick: () => this.setState({ kind: 'lime', depth: 80 }), style: mk(s.kind === 'lime') + ';flex:1' }
    ];
    const equips = [['none', 'Без обустройства'], ['adapter', 'Адаптер'], ['caisson', 'Кессон']].map(([id, label]) => ({ label, pick: () => this.setState({ equip: id }), style: mk(s.equip === id) }));
    const zones = [['city', 'Самара'], ['near', 'До 30 км'], ['far', 'Дальше']].map(([id, label]) => ({ label, pick: () => this.setState({ zone: id }), style: mk(s.zone === id) }));
    const faqSrc = [
      ['Как вы считаете цену?', 'Цена складывается из глубины, типа скважины, обустройства и выезда. Калькулятор выше даёт ориентир, а итоговую сумму мы записываем в договор после замера.'],
      ['Чем песок отличается от известняка?', 'Скважина на песок мельче и дешевле, но требует больше внимания к фильтру. Артезианская глубже, дороже и обычно даёт более стабильный источник воды для дома.'],
      ['Что входит в обустройство?', 'Адаптер или кессон, оголовок, подключение насоса и вывод воды в дом. Состав работ мы согласуем заранее и впишем в договор.'],
      ['Что я получу по окончании работ?', 'Паспорт скважины и акт выполненных работ с глубиной и типом обсадки.']
    ];
    const faq = faqSrc.map(([question, answer], i) => ({ question, answer, open: s.open === i, mark: s.open === i ? '−' : '+', toggle: () => this.setState({ open: s.open === i ? -1 : i }) }));
    return {
      guarantee: this.props.guarantee ?? '5 лет',
      depth, minD, maxD, wellH, tipY, tipBottom: tipY + 14, labelBoxY, labelTextY: labelBoxY + 16,
      kinds, equips, zones, faq,
      onDepth: (e) => this.setState({ depth: Number(e.target.value) }),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      priceText: fmt(total), drillText: fmt(drill), equipText: fmt(equipCost), zoneText: fmt(zoneCost),
      daysText: depth <= 40 ? '1 день' : (depth <= 90 ? '1–2 дня' : '2–3 дня'),
      stages: [
        { n: '01', title: 'Звонок и расчёт', text: 'Уточняем участок, подсказываем тип скважины и называем цену.' },
        { n: '02', title: 'Выезд и замер', text: 'Смотрим подъезд техники и место под бурение.' },
        { n: '03', title: 'Бурение', text: 'Проходим до водоносного слоя и ставим обсадную трубу.' },
        { n: '04', title: 'Обустройство', text: 'Монтируем кессон или адаптер и подключаем воду.' },
        { n: '05', title: 'Паспорт и акт', text: 'Передаём документы и показываем, как пользоваться.' }
      ],
      tiles: [{ title: 'Бурение на участке', src: 'img/bur1.jpg' }, { title: 'Обсадная труба и бетонное кольцо', src: 'img/bur2.jpg' }, { title: 'Кессон с насосным оборудованием', src: 'img/bur3.jpg' }, { title: 'Чистая вода из скважины', src: 'img/bur4.jpg' }, { title: 'Насосная станция в доме', src: 'img/bur5.jpg' }, { title: 'Готовый участок', src: 'img/bur6.jpg' }]
    };
  }
}

mountDC(Component,'tpl','app');
</script>
</body>
</html>
